name: Build Android Node

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "cmake;3.22.1"
          sdkmanager "ndk;27.2.12479018"

      - name: Download Node.js Mobile
        run: |
          curl -L \
            -o nodejs-mobile.zip \
            https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip

      - name: Extract Node.js Mobile
        run: |
          mkdir -p app/libnode
          unzip -q nodejs-mobile.zip -d nodejs-mobile

          cp -R nodejs-mobile/include app/libnode/
          cp -R nodejs-mobile/bin app/libnode/



      - name: Install Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm packages
        working-directory: app/src/main/assets/node-project
        run: npm install

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-node-debug
          path: app/build/outputs/apk/debug/app-debug.apk
